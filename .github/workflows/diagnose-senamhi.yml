name: Diagnóstico de acceso a SENAMHI
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnose:
    name: Diagnóstico ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"
      - name: Consultas públicas independientes con un reintento limitado
        run: python src/diagnose_sources.py
